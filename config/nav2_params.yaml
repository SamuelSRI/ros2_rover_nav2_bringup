bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local


controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 10.0
    cmd_vel_topic: "cmd_vel_nav"

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.30
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # Le contrôleur normal avance principalement vers l'avant.
      # Le recul est géré par le comportement BackUp.
      min_vel_x: 0.10
      max_vel_x: 0.40

      max_vel_y: 0.0

      min_vel_theta: -0.8
      max_vel_theta: 0.8

      min_speed_xy: 0.10
      max_speed_xy: 0.40
      min_speed_theta: 0.0

      acc_lim_x: 0.4
      acc_lim_y: 0.0
      acc_lim_theta: 1.0

      decel_lim_x: -0.4
      decel_lim_y: 0.0
      decel_lim_theta: -1.0

      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20

      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3

      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05

      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist"
        ]

      BaseObstacle.scale: 0.02

      PathAlign.scale: 16.0
      GoalAlign.scale: 12.0
      PathDist.scale: 16.0
      GoalDist.scale: 12.0

      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      # Le local costmap reste dans odom pour éviter
      # les sauts provenant des corrections GPS/globales.
      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 5.0
      publish_frequency: 2.0

      rolling_window: true
      width: 10
      height: 10
      resolution: 0.10

      transform_tolerance: 0.3

      # Rover environ 1.18 m x 0.80 m.
      # Marge de sécurité d'environ 5 cm.
      footprint: "[[0.64, 0.45], [0.64, -0.45], [-0.64, -0.45], [-0.64, 0.45]]"

      plugins:
        [
          "obstacle_layer_360",
          "traversability_layer",
          "inflation_layer"
        ]

      obstacle_layer_360:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: lidar_360

        lidar_360:
          topic: /scan
          data_type: "LaserScan"

          clearing: true
          marking: true

          raytrace_max_range: 8.0
          raytrace_min_range: 0.05

          obstacle_max_range: 6.0
          obstacle_min_range: 0.05

          max_obstacle_height: 1.50
          min_obstacle_height: -0.20

      traversability_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true

        map_topic: /traversability_grid
        subscribe_to_updates: true

        # Conserver false si la grille est publiée continuellement.
        map_subscribe_transient_local: false

        lethal_cost_threshold: 70
        trinary_costmap: true
        track_unknown_space: false

        # La traversabilité peut ajouter des coûts sans effacer
        # les obstacles détectés par le LiDAR 360°.
        use_maximum: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true

        inflation_radius: 0.55
        cost_scaling_factor: 3.0

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      # Le global costmap utilise les corrections map -> odom
      # produites par l'EKF global.
      global_frame: map
      robot_base_frame: base_link

      update_frequency: 2.0
      publish_frequency: 1.0

      # Carte roulante adaptée aux déplacements extérieurs
      # sans carte globale de taille fixe.
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.10

      transform_tolerance: 0.3

      footprint: "[[0.64, 0.45], [0.64, -0.45], [-0.64, -0.45], [-0.64, 0.45]]"

      plugins:
        [
          "obstacle_layer_360",
          "traversability_layer",
          "inflation_layer"
        ]

      obstacle_layer_360:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: lidar_360

        lidar_360:
          topic: /scan
          data_type: "LaserScan"

          clearing: true
          marking: true

          raytrace_max_range: 8.0
          raytrace_min_range: 0.05

          obstacle_max_range: 6.0
          obstacle_min_range: 0.05

          max_obstacle_height: 1.50
          min_obstacle_height: -0.20

      traversability_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true

        map_topic: /traversability_grid
        subscribe_to_updates: true
        map_subscribe_transient_local: false

        lethal_cost_threshold: 70
        trinary_costmap: true
        track_unknown_space: false
        use_maximum: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true

        inflation_radius: 0.55
        cost_scaling_factor: 3.0

      always_send_full_costmap: true


planner_server:
  ros__parameters:
    use_sim_time: false

    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"

      tolerance: 0.5
      use_astar: true
      allow_unknown: true


smoother_server:
  ros__parameters:
    use_sim_time: false

    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true


behavior_server:
  ros__parameters:
    use_sim_time: false

    global_frame: map
    local_frame: odom
    robot_base_frame: base_link

    transform_tolerance: 0.3
    cycle_frequency: 10.0

    behavior_plugins:
      [
        "spin",
        "backup",
        "wait"
      ]

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    wait:
      plugin: "nav2_behaviors::Wait"


waypoint_follower:
  ros__parameters:
    use_sim_time: false

    loop_rate: 20
    stop_on_failure: false


velocity_smoother:
  ros__parameters:
    use_sim_time: false

    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    max_velocity: [0.40, 0.0, 0.8]

    # Autorise le comportement BackUp à envoyer
    # une vitesse linéaire négative.
    min_velocity: [-0.20, 0.0, -0.8]

    max_accel: [0.4, 0.0, 1.0]
    max_decel: [-0.4, 0.0, -1.0]

    odom_topic: "/odometry/local"
    odom_duration: 0.1

    # Les moteurs ne bougent pas correctement sous environ 0.10 m/s.
    deadband_velocity: [0.09, 0.0, 0.02]

    velocity_timeout: 1.0

    input_topic: "cmd_vel_nav"
    output_topic: "cmd_vel_smoothed"


collision_monitor:
  ros__parameters:
    use_sim_time: false

    base_frame_id: "base_link"
    odom_frame_id: "odom"

    transform_tolerance: 0.3

    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"

    state_topic: "collision_monitor_state"

    source_timeout: 2.0
    stop_pub_timeout: 2.0
    base_shift_correction: true

    polygons: ["StopZone"]

    StopZone:
      type: "polygon"

      # Zone couvrant tout le rover avec une marge.
      points: "[[0.70, 0.48], [0.70, -0.48], [-0.65, -0.48], [-0.65, 0.48]]"

      action_type: "stop"
      min_points: 3

      visualize: true
      polygon_pub_topic: "stop_zone"

    observation_sources: ["scan"]

    scan:
      type: "scan"
      topic: "/scan"
      enabled: true


lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true

    # Conservés car ta version de navigation_launch.py
    # les demande au démarrage.
    node_names:
      [
        "controller_server",
        "smoother_server",
        "planner_server",
        "route_server",
        "behavior_server",
        "bt_navigator",
        "waypoint_follower",
        "velocity_smoother",
        "collision_monitor",
        "docking_server"
      ]


docking_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 50.0

    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0

    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.10

    max_retries: 3

    base_frame: "base_link"

    # Le docking utilise la référence locale continue.
    fixed_frame: "odom"
    odom_topic: "/odometry/local"
    odom_duration: 0.3

    dock_prestaging_tolerance: 0.5
    introspection_mode: "disabled"

    dock_plugins: ["simple_charging_dock"]

    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"

      docking_threshold: 0.05
      staging_x_offset: -0.7

      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false

      dock_direction: "forward"

    controller:
      k_phi: 3.0
      k_delta: 2.0

      v_linear_min: 0.10
      v_linear_max: 0.15

      use_collision_detection: true

      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"

      transform_tolerance: 0.3
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3